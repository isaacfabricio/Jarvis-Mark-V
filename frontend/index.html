<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Mark V - Hologram HUD</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="hud-app">
        <!-- Cabeçalho do HUD -->
        <header class="hud-header">
            <h1>J.A.R.V.I.S. MARK V</h1>
            <div class="status-indicator">ONLINE</div>
        </header>

        <!-- Conteúdo Principal do HUD -->
        <main class="hud-content">
            <!-- Painel Central Cognitivo -->
            <section class="core-panel">
                <h2>Núcleo Cognitivo</h2>
                <div class="command-deck">
                    <input type="text" id="command-input" placeholder="Digite um comando para o J.A.R.V.I.S...." />
                    <button id="voice-btn">Falar com J.A.R.V.I.S.</button>
                </div>
            </section>

            <!-- Cards de Telemetria -->
            <aside class="telemetry-card">
                <h3>Telemetria do Sistema</h3>
                <div id="telemetry-data">
                    <p>CPU: <span id="cpu-status">Estável</span></p>
                    <p>Latência: <span id="latency-status">34ms</span></p>
                </div>
            </aside>
        </main>

        <!-- Console de Eventos -->
        <footer class="event-console">
            <h3>Console de Eventos</h3>
            <div id="console-output">[STATUS] Sistemas operacionais carregados com sucesso.</div>
        </footer>
    </div>

    <script src="/static/script.js?v=ws-handlers-1"></script>
</body>
</html>
